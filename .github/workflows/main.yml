name: "Build and deploy"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: "Build and deploy"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          # Starlight's lastUpdated reads each page's last commit date, and
          # silently drops the date for any file missing from the git log
          # (getLastUpdated catches the lookup error and returns undefined).
          # Under the default shallow checkout only the files touched by that
          # one commit get a date; every other page renders no "Updated" line
          # at all. The check is that EVERY page carries one, not that the
          # dates differ.
          fetch-depth: 0
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: "Install dependencies"
        run: npm ci
      - name: "Build"
        run: npm run build
      - name: "Deploy"
        run: |
          aws s3 sync dist s3://help.keboola.com --delete --acl "public-read" --cache-control "max-age=600" --region us-east-1
