name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          # Starlight's lastUpdated reads each page's last commit date, and
          # silently drops the date for any file missing from the git log
          # (getLastUpdated catches the lookup error and returns undefined).
          # Under the default shallow checkout only the files touched by that
          # one commit get a date; every other page renders no "Updated" line
          # at all. The check is that EVERY page carries one, not that the
          # dates differ.
          fetch-depth: 0
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: "Install dependencies"
        run: npm ci
      - name: "Check CLI reference freshness"
        run: npm run check:cli
      - name: "Build"
        run: npm run build
