name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          # Starlight's lastUpdated reads each page's last commit date. The
          # default shallow checkout has one commit, which would stamp every
          # page with the same date.
          fetch-depth: 0
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: "Install dependencies"
        run: npm ci
      - name: "Check CLI reference freshness"
        run: npm run check:cli
      - name: "Build"
        run: npm run build
